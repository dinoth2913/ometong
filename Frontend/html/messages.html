<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages | Ometong</title>
<meta name="description" content="Message suppliers and buyers directly on Ometong.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../images/smile-logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/messages.css">
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
</div>

<!-- ===== NAV ===== -->
<header class="nav" id="mainNav">
  <div class="nav-inner">
    <a href="Home.html" class="logo">
      <img src="../../images/logo.png" alt="Ometong" class="logo-img logo-img-full"><img src="../../images/smile-logo-icon.png" alt="Ometong" class="logo-img logo-img-compact">
    </a>
    <div class="nav-actions">
      <a href="#" class="link-btn" id="backToDashboard">← Back to dashboard</a>
    </div>
  </div>
</header>

<main>
  <div class="msg-shell" id="msgShell">

    <!-- ===== CONVERSATION LIST ===== -->
    <aside class="msg-sidebar" id="msgSidebar">
      <div class="msg-sidebar-head">
        <h1>Messages</h1>
        <div class="msg-search">
          <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="msgSearchInput" placeholder="Search conversations…">
        </div>
      </div>
      <div class="msg-conv-list" id="msgConvList"><!-- populated by messages.js --></div>
    </aside>

    <!-- ===== THREAD ===== -->
    <section class="msg-thread" id="msgThread">
      <div class="msg-thread-empty" id="msgThreadEmpty">
        <svg viewBox="0 0 24 24" width="44" height="44"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <h3>Select a conversation</h3>
        <p>Pick someone from the list to see your message history.</p>
      </div>

      <div class="msg-thread-active" id="msgThreadActive" hidden>
        <div class="msg-thread-header">
          <button class="msg-back-btn" id="msgBackBtn" aria-label="Back to conversation list">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="msg-avatar" id="msgThreadAvatar">HS</div>
          <div class="msg-thread-who">
            <strong id="msgThreadName">Horizon Supply Co.</strong>
            <span id="msgThreadStatus"><span class="msg-status-dot"></span>Online</span>
          </div>
          <a href="#" class="msg-thread-listing" id="msgThreadListing">View listing →</a>
        </div>

        <div class="msg-bubbles" id="msgBubbles"><!-- populated by messages.js --></div>

        <div class="msg-typing" id="msgTyping" hidden>
          <div class="msg-avatar msg-avatar-sm" id="msgTypingAvatar">HS</div>
          <div class="msg-typing-dots"><span></span><span></span><span></span></div>
        </div>

        <form class="msg-composer" id="msgComposer">
          <button type="button" class="msg-attach-btn" aria-label="Attach file (coming soon)">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21.4 11.5l-9 9a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/></svg>
          </button>
          <textarea id="msgInput" placeholder="Type a message…" rows="1"></textarea>
          <button type="submit" class="msg-send-btn" id="msgSendBtn" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </form>
      </div>
    </section>

  </div>
</main>

<script src="../js/messages.js"></script>
</body>
</html>
