<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ometong</title>
  <meta name="description" content="Ometong — the marketplace built for global trade, connecting buyers with suppliers and manufacturers." />
  <link rel="icon" href="images/smile-logo-icon.png" />
  <link rel="stylesheet" href="Frontend/css/pageLoader.css" />
  <!-- No-JS visitors go straight to the real homepage after a brief pause,
       instead of being stuck looking at a splash that never advances. -->
  <noscript><meta http-equiv="refresh" content="0; url=Frontend/html/Home.html" /></noscript>
</head>
<body>

  <div class="loader-screen" id="loaderScreen">

    <div class="glow"></div>

    <div class="logo-wrap">
      <img src="images/smile-logo-icon.png" alt="Ometong" class="logo" id="logo" />
      <div class="ring"></div>
    </div>

    <p class="loading-text">
      Loading<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </p>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <span class="progress-percent" id="progressPercent">0%</span>

  </div>

  <script src="Frontend/js/pageLoader.js"></script>
</body>
</html>
